[project]
name = "forecast-reconciliation-agent"
version = "0.1.0"
description = "Agentic forecast reconciliation between top-down financial targets and bottom-up planner builds (Store Plan / Line Plan / Class Plan), powered by LangChain + Groq (GPT-OSS-20B)."
readme = "README.md"
license = "LicenseRef-Proprietary"
requires-python = ">=3.11"
dependencies = [
    "langchain>=0.3.0",
    "langchain-groq>=0.2.0",
    "langchain-core>=0.3.0",
    "gradio>=5.0.0",
    "pandas>=2.2.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.7.0",
]

[project.scripts]
forecast-reconciliation-agent = "forecast_reconciliation_agent.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/forecast_reconciliation_agent"]
